<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexGlobal - Foreign Transaction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { 50:'#fefbeb',100:'#fef3c7',200:'#fde58a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            darkbg: '#0B0F19', darkcard: '#151B2C', darkborder: '#222B45'
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .balance-blur { filter: blur(5px); cursor: pointer; transition: filter 0.2s ease; }
    .balance-blur:hover { filter: blur(3px); }
    input:focus, select:focus, textarea:focus { color: #f59e0b; caret-color: #f59e0b; }
    .dark input:focus, .dark select:focus, .dark textarea:focus { color: #fbbf24; caret-color: #fbbf24; }

    /* LOADER */
    #app-loader {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #0f172a 0%, #0B0F19 100%);
      z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #app-loader.hidden-loader { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-wrapper { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
    .loader-ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid transparent; border-top-color: #f59e0b; border-right-color: #f59e0b; animation: spinRing 1s linear infinite; }
    .loader-ring-2 { position: absolute; inset: 12px; border-radius: 50%; border: 3px solid transparent; border-bottom-color: #10b981; border-left-color: #10b981; animation: spinRing 1.6s linear infinite reverse; }
    .loader-ring-3 { position: absolute; inset: 24px; border-radius: 50%; border: 2px solid transparent; border-top-color: #6366f1; border-left-color: #6366f1; animation: spinRing 2.2s linear infinite; }
    .loader-logo { position: relative; z-index: 2; width: 52px; height: 52px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 26px; color: #0B0F19; box-shadow: 0 0 30px rgba(245, 158, 11, 0.5); animation: logoPulse 1.6s ease-in-out infinite; }
    @keyframes spinRing { to { transform: rotate(360deg); } }
    @keyframes logoPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(245, 158, 11, 0.5); } 50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(245, 158, 11, 0.8); } }
    .loader-text { margin-top: 28px; color: #94a3b8; font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; animation: fadeText 1.6s ease-in-out infinite; }
    @keyframes fadeText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .loader-dots { margin-top: 10px; display: flex; gap: 6px; }
    .loader-dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; animation: dotBounce 1.4s ease-in-out infinite; }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; background: #10b981; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; background: #6366f1; }
    @keyframes dotBounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1.2); opacity: 1; } }

    /* Price flash */
    .price-up { animation: priceUp 0.6s ease; }
    .price-down { animation: priceDown 0.6s ease; }
    @keyframes priceUp { 0% { color: #10b981; } 100% { color: inherit; } }
    @keyframes priceDown { 0% { color: #ef4444; } 100% { color: inherit; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-darkbg dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <div id="app-loader">
    <div class="loader-wrapper">
      <div class="loader-ring"></div>
      <div class="loader-ring-2"></div>
      <div class="loader-ring-3"></div>
      <div class="loader-logo">A</div>
    </div>
    <div class="loader-text">ApexGlobal</div>
    <div class="loader-dots">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </div>

  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Custom Confirmation Modal -->
  <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-md w-full p-6 shadow-2xl scale-95 transition-transform duration-200" id="modal-content">
      <h3 id="modal-title" class="text-xl font-bold mb-2">Modal Title</h3>
      <p id="modal-text" class="text-slate-500 dark:text-slate-400 mb-6">Modal descriptive message.</p>
      <div class="flex justify-end gap-3">
        <button id="modal-cancel-btn" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl font-semibold text-sm">Cancel</button>
        <button id="modal-confirm-btn" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-slate-950 rounded-xl font-bold text-sm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- PIN Modal -->
  <div id="pin-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="text-center mb-4">
        <div class="w-12 h-12 bg-brand-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
          <i data-lucide="shield" class="w-6 h-6 text-brand-500"></i>
        </div>
        <h3 class="text-xl font-bold">Transaction PIN Required</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your secure PIN</p>
      </div>
      <div class="mb-4">
        <input type="password" id="pin-input" maxlength="6" placeholder="••••••" class="w-full text-center text-2xl tracking-widest bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-4 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-mono">
      </div>
      <div class="flex gap-3">
        <button id="pin-cancel-btn" class="flex-1 px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl font-semibold text-sm">Cancel</button>
        <button id="pin-confirm-btn" class="flex-1 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-slate-950 rounded-xl font-bold text-sm">Verify PIN</button>
      </div>
    </div>
  </div>

  <div id="txn-details-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">Transaction Details</h3>
        <button onclick="closeTxnDetailsModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="txn-details-content" class="space-y-3 text-sm"></div>
    </div>
  </div>

  <!-- Investor Choice Modal -->
  <div id="investor-choice-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">Investor Hub</h3>
        <button onclick="closeInvestorChoice()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="closeInvestorChoice(); navigateTo('add-investor')" class="p-5 bg-slate-50 dark:bg-slate-800 hover:bg-brand-500/10 rounded-2xl text-center transition-colors">
          <div class="w-12 h-12 rounded-xl bg-brand-500/10 text-brand-500 flex items-center justify-center mx-auto mb-2">
            <i data-lucide="user-plus" class="w-6 h-6"></i>
          </div>
          <span class="block text-sm font-bold">Add Investor</span>
          <span class="block text-[10px] text-slate-400 mt-1">Setup wallets & generate link</span>
        </button>
        <button onclick="closeInvestorChoice(); navigateTo('view-investors')" class="p-5 bg-slate-50 dark:bg-slate-800 hover:bg-indigo-500/10 rounded-2xl text-center transition-colors">
          <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center mx-auto mb-2">
            <i data-lucide="users" class="w-6 h-6"></i>
          </div>
          <span class="block text-sm font-bold">View Investors</span>
          <span class="block text-[10px] text-slate-400 mt-1">Approve / Manage</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Generated Link Result Modal -->
  <div id="link-result-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-lg w-full p-6 shadow-2xl">
      <div class="text-center mb-4">
        <div class="w-12 h-12 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
          <i data-lucide="link" class="w-6 h-6 text-emerald-500"></i>
        </div>
        <h3 class="text-xl font-bold">Invite Link Generated</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Share this link with your investor</p>
      </div>
      <div id="link-result-content" class="space-y-3"></div>
      <div class="flex gap-2 mt-5">
        <button onclick="copyGeneratedLink()" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Link
        </button>
        <button onclick="document.getElementById('link-result-modal').classList.add('hidden')" class="flex-1 py-2.5 bg-brand-500 hover:bg-brand-600 text-slate-950 rounded-xl text-xs font-black">
          Done
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN SPA WRAPPER -->
  <div id="app-root" class="flex-grow flex flex-col"></div>

  <script>
    // ============ DATABASES ============
    const MAIN_DB = 'APEXGLOBAL_MOCK_DB';
    const INV_DB = 'APEXINVEST_STANDALONE_DB';

    // ============ FIXED USD PRICES ============
    const COIN_PRICES = { BTC: 65000, ETH: 3200, SOL: 150, USDT: 1.00 };

    // ============ MARKETPLACE ASSETS (with base prices) ============
    const MARKET_ASSETS = [
      // Stocks
      { symbol: 'AAPL', name: 'Apple Inc.', type: 'stock', basePrice: 195.50, icon: '🍎' },
      { symbol: 'TSLA', name: 'Tesla Inc.', type: 'stock', basePrice: 245.30, icon: '⚡' },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', type: 'stock', basePrice: 142.80, icon: '🔍' },
      { symbol: 'MSFT', name: 'Microsoft', type: 'stock', basePrice: 405.20, icon: '💻' },
      { symbol: 'AMZN', name: 'Amazon', type: 'stock', basePrice: 178.90, icon: '📦' },
      { symbol: 'NVDA', name: 'NVIDIA', type: 'stock', basePrice: 118.40, icon: '🎮' },
      // Crypto
      { symbol: 'BTC', name: 'Bitcoin', type: 'crypto', basePrice: 65000, icon: '₿' },
      { symbol: 'ETH', name: 'Ethereum', type: 'crypto', basePrice: 3200, icon: 'Ξ' },
      { symbol: 'SOL', name: 'Solana', type: 'crypto', basePrice: 150, icon: '◎' },
      { symbol: 'USDT', name: 'Tether', type: 'crypto', basePrice: 1.00, icon: '💵' },
      { symbol: 'BNB', name: 'BNB', type: 'crypto', basePrice: 580, icon: '🔶' },
      { symbol: 'XRP', name: 'Ripple', type: 'crypto', basePrice: 0.62, icon: '💧' }
    ];

    // ============ MAIN DB HELPERS ============
    const initialSeedData = {
      users: [{
        id: 'user_01', fullName: 'Alexander Wright', username: 'alexwright',
        email: 'name@apexglobal.com', phone: '+1 555-019-2831', country: 'United States',
        currency: 'USD', passwordHash: '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
        twoFactorEnabled: false, transactionPin: '1234', isInvestor: false
      }],
      wallets: [
        { id: 'w_1', userId: 'user_01', currency: 'USD', balance: 45280.50, pending: 1200.00, primary: true },
        { id: 'w_2', userId: 'user_01', currency: 'EUR', balance: 12450.00, pending: 0.00, primary: false },
        { id: 'w_3', userId: 'user_01', currency: 'GBP', balance: 8300.00, pending: 350.00, primary: false },
        { id: 'w_4', userId: 'user_01', currency: 'JPY', balance: 1450000.00, pending: 0.00, primary: false }
      ],
      transactions: [],
      notifications: [
        { id: 'n_1', userId: 'user_01', title: 'Security Alert', message: 'Logged in from temporary workspace on Chrome.', read: false, date: '2026-05-21T18:00:00.000Z' }
      ],
      virtualCards: [
        { id: 'vc_1', userId: 'user_01', cardholder: 'ALEXANDER WRIGHT', number: '4532 9812 4301 9924', expiry: '09/31', cvv: '413', type: 'VISA', status: 'Active', balance: 5000.00, isFrozen: false }
      ],
      investorProfiles: [],
      investorDeposits: []
    };

    function getDB() {
      const data = localStorage.getItem(MAIN_DB);
      if (!data) {
        localStorage.setItem(MAIN_DB, JSON.stringify(initialSeedData));
        return JSON.parse(JSON.stringify(initialSeedData));
      }
      const parsed = JSON.parse(data);
      if (!parsed.investorProfiles) parsed.investorProfiles = [];
      if (!parsed.investorDeposits) parsed.investorDeposits = [];
      return parsed;
    }
    function saveDB(db) { localStorage.setItem(MAIN_DB, JSON.stringify(db)); }

    // ============ STANDALONE INVESTOR DB ============
    function getInvDB() {
      const data = localStorage.getItem(INV_DB);
      if (!data) {
        const seed = { accounts: [], balances: {}, holdings: {}, deposits: [], notifications: [] };
        localStorage.setItem(INV_DB, JSON.stringify(seed));
        return seed;
      }
      return JSON.parse(data);
    }
    function saveInvDB(db) { localStorage.setItem(INV_DB, JSON.stringify(db)); }

    // ============ HASH HELPERS ============
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function encodeInvite(data) {
      try { return btoa(unescape(encodeURIComponent(JSON.stringify(data)))); }
      catch(e) { return btoa(JSON.stringify(data)); }
    }
    function decodeInvite(str) {
      try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
      catch(e) { try { return JSON.parse(atob(str)); } catch(e2) { return null; } }
    }

    // ============ STATE ============
    let state = {
      currentUser: null,
      activePage: 'login',
      notificationsOpen: false,
      activeReceiptTxn: null,
      transferFilters: { search: '', type: 'all', status: 'all', sort: 'desc' },
      balancesHidden: false,
      pendingInvestorLink: null,
      activeInvestorRecord: null,
      generatedLink: null,
      // Investor-side standalone state
      investorAccount: null,
      investorDashboardTab: 'overview',
      priceData: {}, // { symbol: { price, changePct, prevPrice } }
      priceTickerId: null,
      viewingInvestorId: null // owner looking at an investor's holdings
    };

    // Seed price data
    MARKET_ASSETS.forEach(a => {
      state.priceData[a.symbol] = { price: a.basePrice, changePct: 0, prevPrice: a.basePrice };
    });

    // Restore sessions
    const sessionUser = sessionStorage.getItem('APEX_LOGGED_USER');
    if (sessionUser) {
      state.currentUser = JSON.parse(sessionUser);
      state.activePage = 'dashboard';
    }
    const invSession = sessionStorage.getItem('APEXINVEST_SESSION');
    if (invSession) {
      state.investorAccount = JSON.parse(invSession);
      state.activePage = 'investor-dashboard';
    }

    // Parse invite from URL
    function parseInviteFromUrl() {
      let linkId = null;
      const hashMatch = window.location.hash.match(/invite=([^&]+)/);
      const queryMatch = window.location.search.match(/invite=([^&]+)/);
      if (hashMatch) linkId = decodeURIComponent(hashMatch[1]);
      else if (queryMatch) linkId = decodeURIComponent(queryMatch[1]);
      return linkId;
    }

    function applyInviteLink(encoded) {
      if (!encoded) return false;
      const data = decodeInvite(encoded);
      if (!data || !data.ownerId) return false;
      state.pendingInvestorLink = data;
      if (!state.investorAccount) {
        state.activePage = 'investor-signup';
      }
      return true;
    }

    const initialInviteId = parseInviteFromUrl();
    if (initialInviteId) applyInviteLink(initialInviteId);

    // ============ TOAST / MODAL ============
    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `p-4 mb-3 rounded-xl border flex items-start gap-3 shadow-lg pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 w-80 max-w-full ${
        type === 'success'
          ? 'bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950/30 dark:border-emerald-800 dark:text-emerald-200'
          : type === 'error'
            ? 'bg-rose-50 border-rose-200 text-rose-800 dark:bg-rose-950/30 dark:border-rose-800 dark:text-rose-200'
            : 'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-950/30 dark:border-amber-800 dark:text-amber-200'
      }`;
      const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <p class="font-bold text-sm leading-tight">${title}</p>
          <p class="text-xs mt-0.5 opacity-90">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }

    function triggerModal(title, text, onConfirm) {
      const modal = document.getElementById('custom-modal');
      const modalContent = document.getElementById('modal-content');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-text').textContent = text;
      modal.classList.remove('hidden');
      setTimeout(() => modalContent.classList.remove('scale-95'), 10);
      const closeFn = () => {
        modalContent.classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 100);
      };
      document.getElementById('modal-cancel-btn').onclick = closeFn;
      document.getElementById('modal-confirm-btn').onclick = () => { onConfirm(); closeFn(); };
    }

    function triggerPinVerification(onSuccess) {
      const pinModal = document.getElementById('pin-modal');
      const pinInput = document.getElementById('pin-input');
      pinInput.value = '';
      pinModal.classList.remove('hidden');
      const closePinModal = () => { pinModal.classList.add('hidden'); pinInput.value = ''; };
      const verifyPin = () => {
        const db = getDB();
        const user = db.users.find(u => u.id === state.currentUser.id);
        if (user.transactionPin === pinInput.value) {
          closePinModal();
          if (onSuccess) onSuccess();
        } else {
          showToast('Invalid PIN', 'Incorrect PIN.', 'error');
          pinInput.value = '';
          pinInput.focus();
        }
      };
      document.getElementById('pin-confirm-btn').onclick = verifyPin;
      document.getElementById('pin-cancel-btn').onclick = closePinModal;
      pinInput.onkeypress = (e) => { if (e.key === 'Enter') verifyPin(); };
      pinInput.focus();
    }

    function navigateTo(page) {
      state.activePage = page;
      renderApp();
      window.scrollTo(0, 0);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('dark-mode', isDark ? 'enabled' : 'disabled');
      showToast('Theme Updated', `Switched to ${isDark ? 'Dark' : 'Light'} Mode.`, 'info');
    }

    if (localStorage.getItem('dark-mode') === 'enabled') {
      document.documentElement.classList.add('dark');
    }

    function closeTxnDetailsModal() { document.getElementById('txn-details-modal').classList.add('hidden'); }
    function toggleBalanceVisibility() {
      state.balancesHidden = !state.balancesHidden;
      renderApp();
    }
    function formatBalance(currency, amount) {
      if (state.balancesHidden) return '••••••';
      return `${formatCurrencySymbol(currency)}${amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    }
    function formatCurrencySymbol(curr) {
      switch(curr) {
        case 'USD': return '$'; case 'EUR': return '€'; case 'GBP': return '£';
        case 'JPY': return '¥'; case 'CAD': return 'C$'; case 'AUD': return 'A$';
        default: return '$';
      }
    }

    // ============ INVESTOR HELPERS ============
    function openInvestorChoice() { document.getElementById('investor-choice-modal').classList.remove('hidden'); }
    function closeInvestorChoice() { document.getElementById('investor-choice-modal').classList.add('hidden'); }

    // ============ PRICE TICKER ============
    function startPriceTicker() {
      if (state.priceTickerId) return;
      state.priceTickerId = setInterval(() => {
        MARKET_ASSETS.forEach(a => {
          const pd = state.priceData[a.symbol];
          const change = (Math.random() - 0.5) * 0.012; // ±0.6%
          const newPrice = pd.price * (1 + change);
          pd.prevPrice = pd.price;
          pd.price = newPrice;
          pd.changePct = ((newPrice - a.basePrice) / a.basePrice) * 100;
        });
        // Only re-render if on marketplace or portfolio page
        if (state.activePage === 'investor-dashboard' && (state.investorDashboardTab === 'market' || state.investorDashboardTab === 'portfolio')) {
          renderApp();
        }
      }, 3000);
    }

    function approveInvestorDeposit(profileId, depositId) {
      const db = getDB();
      const profile = db.investorProfiles.find(p => p.id === profileId);
      const deposit = db.investorDeposits.find(d => d.id === depositId);
      if (!profile || !deposit) return;

      const usdAmount = deposit.amount * COIN_PRICES[deposit.coin];
      deposit.status = 'approved';
      deposit.usdAmount = usdAmount;
      deposit.approvedAt = new Date().toISOString();

      // Notify via main DB
      db.notifications.push({
        id: `n_${Date.now()}`,
        userId: profile.ownerId,
        title: '✅ Deposit Approved',
        message: `You approved ${deposit.amount} ${deposit.coin} (~$${usdAmount.toFixed(2)}) from ${profile.investorName || 'Investor'}.`,
        read: false,
        date: new Date().toISOString()
      });

      saveDB(db);
      showToast('Deposit Approved', `$${usdAmount.toFixed(2)} credited to investor.`);
      renderApp();
    }

    // ============ INVESTOR: SIGNUP ============
    async function investorSignup(e) {
      e.preventDefault();
      const fullName = document.getElementById('inv-fullname').value.trim();
      const username = document.getElementById('inv-username').value.trim();
      const email = document.getElementById('inv-email').value.trim();
      const phone = document.getElementById('inv-phone').value.trim();
      const password = document.getElementById('inv-password').value;
      const confirm = document.getElementById('inv-confirm').value;

      if (password !== confirm) { showToast('Error', 'Passwords do not match.', 'error'); return; }
      if (!phone) { showToast('Error', 'Phone required.', 'error'); return; }

      const invdb = getInvDB();
      if (invdb.accounts.some(a => a.username === username || a.email === email)) {
        showToast('Already Exists', 'Username or email taken.', 'error'); return;
      }

      const hash = await sha256(password);
      const account = {
        id: `IA-${Date.now()}`,
        fullName, username, email, phone, passwordHash: hash,
        ownerId: state.pendingInvestorLink.ownerId,
        ownerName: state.pendingInvestorLink.ownerName,
        wallets: state.pendingInvestorLink.wallets,
        createdAt: new Date().toISOString()
      };
      invdb.accounts.push(account);
      invdb.balances[account.id] = invdb.balances[account.id] || 0;
      invdb.holdings[account.id] = invdb.holdings[account.id] || {};
      saveInvDB(invdb);

      // Save investor into owner's main DB (same browser only)
      const db = getDB();
      const profile = db.investorProfiles.find(p =>
        p.ownerId === account.ownerId && p.encoded === encodeInvite(state.pendingInvestorLink)
      ) || db.investorProfiles.find(p => p.ownerId === account.ownerId && !p.investorUserId);

      if (profile) {
        profile.investorUserId = account.id;
        profile.investorName = fullName;
        profile.investorUsername = username;
        profile.investorEmail = email;
        profile.investorPhone = phone;
        profile.investorPassword = password;
        profile.status = 'active';
        saveDB(db);

        db.notifications.push({
          id: `n_${Date.now()}`,
          userId: account.ownerId,
          title: '🎉 New Investor Signed Up',
          message: `${fullName} (@${username}) joined via your invite link.`,
          read: false,
          date: new Date().toISOString()
        });
        saveDB(db);
      }

      sessionStorage.setItem('APEXINVEST_SESSION', JSON.stringify(account));
      state.investorAccount = account;
      state.activePage = 'investor-dashboard';
      state.investorDashboardTab = 'overview';
      showToast('Welcome!', 'Investment account created.');
      renderApp();
    }

    // ============ INVESTOR: BUY ASSET ============
    function buyAsset(symbol) {
      const asset = getAssetBySymbol(symbol);
      if (!asset) return;
      const invdb = getInvDB();
      const account = state.investorAccount;
      const balance = invdb.balances[account.id] || 0;
      const price = state.priceData[symbol].price;

      const inputEl = document.getElementById(`buy-qty-${symbol}`);
      const qty = parseFloat(inputEl ? inputEl.value : 0);
      if (!qty || qty <= 0) { showToast('Invalid', 'Enter quantity.', 'error'); return; }

      const cost = qty * price;
      if (cost > balance) { showToast('Insufficient Funds', `Need $${cost.toFixed(2)}`, 'error'); return; }

      invdb.balances[account.id] = balance - cost;
      invdb.holdings[account.id] = invdb.holdings[account.id] || {};
      invdb.holdings[account.id][symbol] = (invdb.holdings[account.id][symbol] || 0) + qty;
      saveInvDB(invdb);

      showToast('Purchase Complete', `Bought ${qty} ${symbol} for $${cost.toFixed(2)}`);
      renderApp();
    }

    function sellAsset(symbol) {
      const invdb = getInvDB();
      const account = state.investorAccount;
      const holdings = invdb.holdings[account.id] || {};
      const held = holdings[symbol] || 0;
      if (held <= 0) { showToast('No Holdings', 'You do not own this asset.', 'error'); return; }
      const price = state.priceData[symbol].price;
      const proceeds = held * price;
      delete holdings[symbol];
      invdb.holdings[account.id] = holdings;
      invdb.balances[account.id] = (invdb.balances[account.id] || 0) + proceeds;
      saveInvDB(invdb);
      showToast('Sold', `Sold ${held} ${symbol} for $${proceeds.toFixed(2)}`);
      renderApp();
    }

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mt-8">
          <div class="lg:col-span-2 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm relative overflow-hidden">
                <span class="text-xs font-extrabold uppercase text-slate-400">Available Base Capital</span>
                <h2 class="text-3xl font-extrabold mt-3">${formatBalance(primaryWallet.currency, primaryWallet.balance)}</h2>
              </div>
              <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm">
                <span class="text-xs font-extrabold uppercase text-slate-400">Multi-Wallet Buffer</span>
                <div class="grid grid-cols-2 gap-3 mt-4">
                  ${userWallets.map(w => `
                    <div class="p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-800">
                      <span class="text-[10px] text-slate-400 block">${w.currency}</span>
                      <span class="text-sm font-black">${formatBalance(w.currency, w.balance)}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm">
              <h3 class="font-bold text-base mb-4">Quick Utilities</h3>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <button onclick="navigateTo('transfer')" class="p-4 bg-slate-50 dark:bg-slate-800 hover:bg-brand-500/10 rounded-2xl text-center">
                  <div class="w-10 h-10 rounded-xl bg-brand-500/10 text-brand-500 flex items-center justify-center mx-auto">
                    <i data-lucide="send" class="w-5 h-5"></i>
                  </div>
                  <span class="block text-xs font-bold mt-2.5">Send Global</span>
                </button>
                <button onclick="navigateTo('add-funds')" class="p-4 bg-slate-50 dark:bg-slate-800 hover:bg-brand-500/10 rounded-2xl text-center">
                  <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center mx-auto">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                  </div>
                  <span class="block text-xs font-bold mt-2.5">Add Funds</span>
                </button>
                <button onclick="navigateTo('analytics')" class="p-4 bg-slate-50 dark:bg-slate-800 hover:bg-brand-500/10 rounded-2xl text-center">
                  <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center mx-auto">
                    <i data-lucide="bar-chart" class="w-5 h-5"></i>
                  </div>
                  <span class="block text-xs font-bold mt-2.5">Insights</span>
                </button>
                <button onclick="openInvestorChoice()" class="p-4 bg-slate-50 dark:bg-slate-800 hover:bg-brand-500/10 rounded-2xl text-center">
                  <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center mx-auto">
                    <i data-lucide="trending-up" class="w-5 h-5"></i>
                  </div>
                  <span class="block text-xs font-bold mt-2.5">Investors</span>
                </button>
              </div>
            </div>
          </div>

          <div class="space-y-8">
            <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm">
              <h3 class="font-bold text-base mb-4">Virtual Card</h3>
              ${card ? `
                <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-black rounded-2xl p-6 text-white min-h-[180px] flex flex-col justify-between">
                  <div class="flex justify-between items-start">
                    <span class="text-[10px] font-extrabold text-brand-500 uppercase">APEX GLOBAL</span>
                    <span class="text-lg font-black italic text-brand-500">MasterCard</span>
                  </div>
                  <p class="text-base font-bold tracking-widest font-mono">${card.number}</p>
                  <div class="flex justify-between items-end">
                    <span class="text-xs font-bold">${card.cardholder}</span>
                    <span class="text-xs font-mono">${card.expiry}</span>
                  </div>
                </div>
              ` : `<p class="text-xs text-slate-400">No card</p>`}
            </div>
          </div>
        </div>
      `;
    }

    function renderTransferView() {
      const db = getDB();
      const wallets = db.wallets.filter(w => w.userId === state.currentUser.id);
      setTimeout(() => {
        const form = document.getElementById('transfer-sim-form');
        if (form) form.onsubmit = (e) => {
          e.preventDefault();
          triggerPinVerification(() => showToast('Transfer Sent', 'Processed.'));
        };
      }, 50);
      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <h1 class="text-2xl font-black">Foreign Transfer Simulator</h1>
          <form id="transfer-sim-form" class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">From Wallet</label>
              <select class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 text-sm">
                ${wallets.map(w => `<option>${w.currency} (Bal: ${formatBalance(w.currency, w.balance)})</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Amount</label>
              <input type="number" required placeholder="1000" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Receiver Name</label>
              <input type="text" required placeholder="John Miller" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 text-sm">
            </div>
            <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 py-3.5 rounded-xl text-slate-950 font-black text-sm">Authorize with PIN</button>
          </form>
        </div>
      `;
    }

    function renderAddFundsView() {
      setTimeout(() => {
        const form = document.getElementById('funding-sim-form');
        if (form) form.onsubmit = (e) => { e.preventDefault(); showToast('Deposit Processed', 'Funds added.'); };
      }, 50);
      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <h1 class="text-2xl font-black">Load Funds</h1>
          <form id="funding-sim-form" class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Amount</label>
              <input type="number" required placeholder="5000" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 text-sm font-bold">
            </div>
            <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 py-3.5 rounded-xl text-slate-950 font-black text-sm">Fund Account</button>
          </form>
        </div>
      `;
    }

    function renderWalletsView() {
      const db = getDB();
      const wallets = db.wallets.filter(w => w.userId === state.currentUser.id);
      return `
        <div class="space-y-6">
          <h1 class="text-2xl font-black">Wallets</h1>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${wallets.map(w => `
              <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6">
                <span class="text-xs font-black px-2.5 py-1 rounded bg-slate-100 dark:bg-slate-800">${w.currency}</span>
                <p class="text-3xl font-black mt-4">${formatBalance(w.currency, w.balance)}</p>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTransactionsView() {
      return `
        <div class="space-y-6">
          <h1 class="text-2xl font-black">Transaction Ledger</h1>
          <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-12 text-center">
            <p class="text-xs text-slate-400">No transactions to display.</p>
          </div>
        </div>
      `;
    }

    function renderAnalyticsView() {
      return `
        <div class="space-y-6">
          <h1 class="text-2xl font-black">Analytics Insights</h1>
          <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-12 text-center">
            <p class="text-xs text-slate-400">Analytics dashboard.</p>
          </div>
        </div>
      `;
    }

    function renderSettingsView() {
      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <h1 class="text-2xl font-black">Account Settings</h1>
          <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6">
            <p class="text-xs text-slate-400">Settings panel.</p>
          </div>
        </div>
      `;
    }

    function initializeCharts() {}

    function toggle2FASystem() {}
    function togglePasswordVisibility() {}

    // URL change handlers
    window.addEventListener('hashchange', () => {
      const linkId = parseInviteFromUrl();
      if (linkId) { applyInviteLink(linkId); renderApp(); }
    });
    window.addEventListener('popstate', () => {
      const linkId = parseInviteFromUrl();
      if (linkId) { applyInviteLink(linkId); renderApp(); }
    });

    window.onload = function() {
      const linkId = parseInviteFromUrl();
      if (linkId) applyInviteLink(linkId);
      renderApp();
      setTimeout(() => {
        const loader = document.getElementById('app-loader');
        if (loader) loader.classList.add('hidden-loader');
      }, 1400);
    };
  </script>
</body>
</html>
